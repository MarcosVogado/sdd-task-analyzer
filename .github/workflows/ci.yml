# Pipeline de Integração Contínua do TaskAnalyzer (Fase 3 — Bootcamp III).
# Toda alteração em main/develop (push ou Pull Request) passa pelo Test Harness
# do contrato SDD e pela validação da imagem Docker. Build vermelho = merge bloqueado.
name: CI — TaskAnalyzer

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test-harness:
    name: Test Harness (pytest · Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências autorizadas (requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Test Harness
        run: pytest tests/test_harness.py -v

  docker:
    name: Build da imagem e testes no container
    runs-on: ubuntu-latest
    needs: test-harness
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: docker build -t sdd-task-analyzer:ci .

      - name: Executar Test Harness dentro do container
        run: docker run --rm sdd-task-analyzer:ci
